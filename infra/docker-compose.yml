# id="compose_v63"
version: "3.9"

services:

  backend:
    build: ../backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build: ../frontend
    ports:
      - "5173:5173"

  db:
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: app

  redis:
    image: redis
